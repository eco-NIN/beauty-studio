services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: beauty_studio
      POSTGRES_USER: beauty_studio
      POSTGRES_PASSWORD: beauty_studio_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "beauty_studio", "-d", "beauty_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
